[workspace]
resolver = "2"

members = [
  "crates/atlas-graph",
  "crates/atlas-provider",
  "crates/atlas-aws",
  "crates/atlas-azure",
  "crates/atlas-cloudflare",
  "crates/atlas-gcp",
  "crates/atlas-engine",
  "crates/atlas-cli",
  "crates/atlas-server",
  "crates/atlas-layout",
  "crates/atlas-layout-wasm",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["KMC <kenny.kor.seo@gmail.com>"]
license = "MPL-2.0"
repository = "https://github.com/k-cross/cloud-atlas"
documentation = "https://github.com/k-cross/cloud-atlas"

[workspace.dependencies]
atlas-aws = { path = "crates/atlas-aws" }
atlas-azure = { path = "crates/atlas-azure" }
atlas-cloudflare = { path = "crates/atlas-cloudflare" }
atlas-engine = { path = "crates/atlas-engine" }
atlas-gcp = { path = "crates/atlas-gcp" }
atlas-graph = { path = "crates/atlas-graph" }
atlas-layout = { path = "crates/atlas-layout" }
atlas-provider = { path = "crates/atlas-provider" }

aws-config = "1.0"
aws-credential-types = "1"
aws-sdk-apigateway = "1.0"
aws-sdk-cloudfront = "1.0"
aws-sdk-config = "1.0"
aws-sdk-directconnect = "1.0"
aws-sdk-dynamodb = "1.0"
aws-sdk-ec2 = "1.0"
aws-sdk-ecs = "1.0"
aws-sdk-eks = "1.0"
aws-sdk-elasticloadbalancingv2 = "1.0"
aws-sdk-eventbridge = "1.0"
aws-sdk-lambda = "1.0"
aws-sdk-rds = "1.0"
aws-sdk-route53 = "1.0"
aws-sdk-s3 = "1"
aws-sdk-sns = "1.0"
aws-sdk-sqs = "1.0"
aws-smithy-runtime = "1"
aws-smithy-types = "1.0"
axum = "0.7"
azure_core = "1.0.0"
azure_identity = "1.0.0"
ciborium = "0.2"
clap = { version = "4.0", features = ["derive"] }
cloudflare = "0.14.0"
flate2 = "1"
futures = "0.3"
http = "1"
js-sys = "0.3"
percent-encoding = "2"
petgraph = "0.7"
proptest = "1"
rayon = "1.12.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.21", features = ["full"] }
tower-http = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
wasm-bindgen = "0.2"
wiremock = "0.6"
yup-oauth2 = "11"

# The wasm artifact ships to browsers; trade compile time for size and speed.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
