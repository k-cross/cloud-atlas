[package]
name = "atlas-lib"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
keywords = ["AWS", "cloud", "graph", "infrastructure"]
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
atlas-graph.workspace = true
aws-config.workspace = true
aws-credential-types.workspace = true
aws-sdk-apigateway.workspace = true
aws-sdk-cloudfront.workspace = true
aws-sdk-config.workspace = true
aws-sdk-directconnect.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-ec2.workspace = true
aws-sdk-ecs.workspace = true
aws-sdk-eks.workspace = true
aws-sdk-elasticloadbalancingv2.workspace = true
aws-sdk-eventbridge.workspace = true
aws-sdk-lambda.workspace = true
aws-sdk-rds.workspace = true
aws-sdk-route53.workspace = true
aws-sdk-sns.workspace = true
aws-sdk-sqs.workspace = true
azure_core.workspace = true
azure_identity.workspace = true
cloudflare.workspace = true
futures.workspace = true
petgraph.workspace = true
rayon.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
yup-oauth2.workspace = true
aws-smithy-types.workspace = true
aws-sdk-s3.workspace = true
flate2.workspace = true
percent-encoding.workspace = true

[dev-dependencies]
# Collector tests replay canned cloud API responses without credentials or
# network: wiremock for the reqwest-based clients (GCP/Cloudflare/Azure),
# smithy's replay client for the AWS SDK. See tests/{gcp,aws}_collector.rs.
wiremock.workspace = true
serde_json.workspace = true
aws-smithy-runtime = { workspace = true, features = ["client", "test-util"] }
ciborium.workspace = true
aws-credential-types = { workspace = true, features = ["test-util"] }
http.workspace = true
proptest.workspace = true
