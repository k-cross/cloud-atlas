[package]
name = "atlas-server"
description = "Live backend: owns the in-memory graph, polls providers, and pushes incremental patches over WebSocket."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
atlas-graph.workspace = true
atlas-aws.workspace = true
atlas-engine.workspace = true
axum = { workspace = true, features = ["ws"] }
clap = { workspace = true, features = ["unicode"] }
futures.workspace = true
petgraph.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http = { workspace = true, features = ["cors"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "atlas-server"
path = "src/main.rs"
