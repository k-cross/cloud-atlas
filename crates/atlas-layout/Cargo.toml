[package]
name = "atlas-layout"
description = "Force-directed layout engine for cloud-atlas render snapshots. Pure Rust, wasm-compatible."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rayon = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest.workspace = true

[features]
default = []
# Parallel force computation. Usable natively today; browser wasm needs
# threads (SharedArrayBuffer + atomics, e.g. wasm-bindgen-rayon) — see docs/rendering.md.
parallel = ["dep:rayon"]
